<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1120">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="e-Irigasi">
<title>e-Irigasi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1120;--s1:#111b2f;--s2:#18253d;--ln:#2a3b5c;--tx:#eaf1fb;--mu:#93a6c4;--cy:#22d3ee;--am:#fbbf24;--lm:#a3e635;--rs:#fb7185}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:20}
header h1{font-size:17px;font-weight:800;flex:1}
header small{color:var(--mu);font-weight:400;display:block;font-size:12px}
.back{background:var(--s2);border:1px solid var(--ln);border-radius:10px;width:40px;height:40px;font-size:20px}
main{max-width:980px;margin:0 auto;padding:16px}
.juru{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.jb{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:16px;text-align:left}
.jb:hover{border-color:var(--cy)}
.jb b{display:block;font-size:19px;font-weight:800}
.jb span{color:var(--mu);font-size:13px}
.lead{color:var(--mu);max-width:56ch}
input[type=search]{width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;color:var(--tx);padding:12px 14px;font:inherit;margin:14px 0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left}
.row:hover{border-color:var(--cy)}
.row b{font-weight:600}.row em{font-style:normal;color:var(--cy);font-weight:800;text-align:right}
.row span{color:var(--mu);font-size:13px}
#map{height:56vh;min-height:320px;border-radius:14px;border:1px solid var(--ln);position:relative}
.coord{position:absolute;left:10px;bottom:10px;z-index:500;background:#0a1120e6;border:1px solid var(--ln);border-radius:8px;padding:5px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.leg{display:flex;gap:16px;flex-wrap:wrap;color:var(--mu);font-size:13px;margin:10px 2px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;background:var(--s1);border:1px solid var(--ln);border-radius:10px;padding:10px 2px;font-size:13px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--cy);color:#04141a;border-color:var(--cy)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.card span{color:var(--mu);font-size:13px}.card b{display:block;font-size:24px;font-weight:800}
.card b small{font-size:13px;color:var(--mu);font-weight:400}
h2{font-size:15px;margin:20px 0 10px}
.bar{display:grid;grid-template-columns:96px 1fr 76px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar div{height:14px;background:var(--s2);border-radius:7px;overflow:hidden}
.bar div i{display:block;height:100%;border-radius:7px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left}
th{color:var(--mu);font-weight:600;font-size:13px}td:nth-child(n+2){font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
.note{color:var(--mu);font-size:13px;margin-top:10px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--s2);color:var(--tx)}
.ed{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:16px 0 4px}
.ed label{display:grid;gap:4px;color:var(--mu);font-size:13px}
input[type=number]{background:var(--s1);border:1px solid var(--ln);border-radius:10px;color:var(--tx);padding:10px 12px;font:inherit;width:140px}
.btn{background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.p{background:var(--cy);color:#04141a;border-color:var(--cy)}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input[type=file]{color:var(--mu);margin-top:6px;max-width:100%}
.skw{border:1px solid var(--ln);border-radius:14px;background:#0a1120;overflow:hidden}
.skw svg{display:block;width:100%;height:64vh;touch-action:none;user-select:none}
.osmd{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.9)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--ln);background:var(--s1);cursor:pointer;display:block}
.fm{display:grid;gap:10px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:6px 0 4px}
.fm label,.lbl{display:grid;gap:4px;color:var(--mu);font-size:13px}
.fm select,.fm input[type=text],.lbi select{background:var(--s2);border:1px solid var(--ln);border-radius:10px;color:var(--tx);padding:10px 12px;font:inherit;width:100%}
.lb{position:fixed;inset:0;z-index:2000;background:#050a14f2;display:grid;place-items:center;padding:12px;overflow:auto}
.lbi{max-width:760px;width:100%;display:grid;gap:10px}.lbi img{width:100%;max-height:62vh;object-fit:contain;border-radius:12px;background:#000}
.cb{background:var(--s2);border:1px solid var(--ln);border-radius:6px;color:var(--tx);padding:3px 9px;font:inherit;font-size:12px;margin-left:6px;text-decoration:none;cursor:pointer}
a.btn{text-decoration:none;color:var(--tx);display:inline-block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--cy);color:#04141a;font-weight:600;border-radius:10px;padding:10px 16px;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.imp{margin-top:28px;border-top:1px solid var(--ln);padding-top:6px}
</style>
</head>
<body>
<header><button class="back" id="back" aria-label="Kembali" hidden>‹</button><h1 id="ttl">e-Irigasi</h1></header>
<main id="app"><p class="lead">Memuat data…</p></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
let DB,map,st={j:null,d:null,tab:'ring'},OV={},UP=null,MSG='';
const $=s=>document.querySelector(s),app=$('#app'),n1=(x,d=1)=>(+x||0).toLocaleString('id-ID',{maximumFractionDigits:d}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const baku=d=>{if(OV[d.nama]!=null)return OV[d.nama];if(d.bakuEdit!=null)return d.bakuEdit;const x=d.tanam&&d.tanam.baku;if(!x)return d.bakuKmz;return Math.abs(x-d.bakuKmz)/x>.15?Math.max(x,d.bakuKmz):x};
try{st.j=localStorage.getItem('juru');OV=JSON.parse(localStorage.getItem('ov')||'{}');UP=JSON.parse(localStorage.getItem('up')||'null')}catch(e){}
fetch('data.json').then(r=>r.json()).then(j=>{DB=j;applyUp();route()}).catch(()=>app.innerHTML='<p class="lead">Data gagal dimuat. Pastikan data.json ada di folder yang sama dengan index.html.</p>');
$('#back').onclick=()=>{if(st.d){st.d=null}else{st.j=null;try{localStorage.removeItem('juru')}catch(e){}}route()};
function route(){if(map){map.remove();map=null}$('#back').hidden=!st.j;st.d?detail():st.j?list():home()}
function home(){
  $('#ttl').innerHTML='e-Irigasi<small>UPTD Purwosari · Periode '+esc(DB.periode)+'</small>';
  app.innerHTML='<p class="lead">Pilih juru pengairan untuk melihat daerah irigasi yang menjadi tanggung jawab Anda.</p><div class="juru">'+
  DB.juru.map(j=>{const a=DB.di.filter(d=>d.juru===j);return `<button class="jb" data-j="${esc(j)}"><b>${esc(j)}</b><span>${a.length} daerah irigasi · ${n1(a.reduce((s,d)=>s+baku(d),0),0)} ha</span></button>`}).join('')+'</div>';
  app.querySelectorAll('.jb').forEach(b=>b.onclick=()=>{st.j=b.dataset.j;try{localStorage.setItem('juru',st.j)}catch(e){}route()});xl();
}
function list(){
  $('#ttl').innerHTML='Juru '+esc(st.j)+'<small>Pilih daerah irigasi</small>';
  const a=DB.di.filter(d=>d.juru===st.j);
  app.innerHTML='<input type="search" id="q" placeholder="Cari daerah irigasi" aria-label="Cari daerah irigasi"><div id="ls"></div>';
  const draw=()=>{const q=$('#q').value.toLowerCase();$('#ls').innerHTML=a.filter(d=>d.nama.toLowerCase().includes(q)).map(d=>`<button class="row" data-i="${d.id}"><b>DI ${esc(d.nama)}</b><em>${n1(baku(d),0)} ha</em><span>${n1(d.panjangKm,2)} km saluran · ${d.bangunan.length} bangunan</span><span style="text-align:right">peta ${d.tahun}</span></button>`).join('')||'<p class="lead">Tidak ada yang cocok.</p>';
    $('#ls').querySelectorAll('.row').forEach(b=>b.onclick=()=>{st.d=DB.di.find(d=>d.id==b.dataset.i);st.tab='ring';route()})};
  $('#q').oninput=draw;draw();
}
function detail(){
  const d=st.d,t=d.tanam;
  $('#ttl').innerHTML='DI '+esc(d.nama)+'<small>Juru '+esc(d.juru)+' · peta '+d.tahun+'</small>';
  app.innerHTML='<div id="map"><div class="coord"><span id="co">Geser peta untuk melihat koordinat</span><button class="cb" id="cps" type="button">Salin</button><a class="cb" id="cmp" target="_blank" rel="noopener">Maps</a></div></div>'+
  '<div class="leg"><span><i style="background:var(--am)"></i>Baku sawah</span><span><i style="background:var(--cy)"></i>Saluran</span><span><i style="background:var(--lm);border-radius:50%"></i>Bangunan</span></div>'+
  '<div class="leg" id="lgk" hidden>'+KL.map(k=>`<span><i style="background:${k[2]};border-radius:50%"></i>${k[1]}</span>`).join('')+'</div><div class="tabs" role="tablist">'+[['ring','Ringkasan'],['skm','Skema'],['deb','Debit'],['bgn','Bangunan'],['fto','Foto']].map(x=>`<button role="tab" data-t="${x[0]}" aria-selected="${st.tab==x[0]}">${x[1]}</button>`).join('')+'</div><div id="tb"></div>';
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;app.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x==b));tab()});
  drawMap();tab();
}
function drawMap(){
  const d=st.d,sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:17,attribution:'Esri'}),
  dark=L.layerGroup([L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:16,attribution:'Esri'}),L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:21,maxNativeZoom:16})]),
  osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:21,maxNativeZoom:19,className:'osmd',attribution:'© OpenStreetMap'});
  map=L.map('map',{layers:[sat],maxZoom:21});L.control.layers({'Satelit':sat,'Peta gelap':dark,'Peta jalan (gelap)':osm},null,{collapsed:true}).addTo(map);
  const g=L.featureGroup().addTo(map);
  d.areal.forEach(a=>L.polygon(a[2],{color:'#fbbf24',weight:2,fillOpacity:.3}).bindPopup(`<b>${esc(a[0]||'Petak')}</b><br>${n1(a[1],2)} ha`).addTo(g));
  d.saluran.forEach(s=>L.polyline(s[2],{color:'#22d3ee',weight:3.5}).bindPopup(`<b>${esc(s[0]||'Saluran')}</b><br>${n1(s[1],0)} m`).addTo(g));
  map._mk={};d.bangunan.forEach(b=>{map._mk[b[0]]=L.circleMarker([b[1],b[2]],{radius:7,color:'#04141a',weight:2,fillColor:'#a3e635',fillOpacity:1}).bindPopup(()=>popB(d,b)).addTo(g)});
  if(g.getBounds().isValid())map.fitBounds(g.getBounds(),{padding:[20,20]});
  const co=$('#co'),show=p=>{co.textContent=p.lat.toFixed(5)+', '+p.lng.toFixed(5);$('#cmp').href=mapsUrl(p.lat,p.lng)};
  map.on('mousemove',e=>show(e.latlng));map.on('moveend',()=>show(map.getCenter()));
  map.on('click',e=>show(e.latlng));map._g=g;
  L.DomEvent.disableClickPropagation(co.parentNode);$('#cps').onclick=()=>{const t=co.textContent;if(/^-?\d/.test(t))salin(t)};if(fotoOn())muatLap(d).then(warnai);
}
function tab(){
  const d=st.d,t=d.tanam,el=$('#tb');
  if(st.tab=='skm')return skm(el);
  if(st.tab=='fto')return fto(el);
  if(st.tab=='deb'){
    el.innerHTML='<div class="wrap"><table><thead><tr><th>Tempat ukur</th><th>Q (lt/dt)</th><th>Tinggi (cm)</th><th>Kond.</th></tr></thead><tbody>'+d.debit.map(x=>`<tr><td>${esc(x.n)}</td><td>${n1(x.q)}</td><td>${n1(x.h)}</td><td>${esc(x.kond||'-')}</td></tr>`).join('')+'</tbody></table></div><p class="note">Debit adalah rata-rata pengukuran tanggal '+esc(DB.periode)+'.</p>';
  }else if(st.tab=='bgn'){
    drawBgn(el,d);if(fotoOn())muatLap(d).then(()=>{if(st.tab=='bgn'&&st.d===d)drawBgn(el,d)});
  }else{
    const bk=baku(d),rows=t?[['Padi',t.padi,'#a3e635'],['Tebu',t.tebu,'#22d3ee'],['Palawija',t.palawija,'#fbbf24'],['Bero',t.bero,'#fb7185'],['Habis panen',t.panen,'#c4b5fd']]:[];
    el.innerHTML='<div class="cards"><div class="card"><span>Baku sawah</span><b>'+n1(bk,0)+' <small>ha</small></b></div><div class="card"><span>Panjang saluran</span><b>'+n1(d.panjangKm,2)+' <small>km</small></b></div><div class="card"><span>Bangunan</span><b>'+d.bangunan.length+'</b></div></div>'+edform(d,bk)+
    (t?'<h2>Tanaman periode '+esc(DB.periode)+'</h2>'+rows.map(r=>`<div class="bar"><span>${r[0]}</span><div><i style="width:${Math.min(100,bk?r[1]/bk*100:0)}%;background:${r[2]}"></i></div><b>${n1(r[1])} ha</b></div>`).join('')+(t.persiapan?`<p class="note">Persiapan padi (pembibitan dan garap tanah): ${n1(t.persiapan)} ha.</p>`:''):'<p class="note">Data tanaman untuk DI ini belum terbaca dari Excel.</p>')+
    (t&&Math.abs(t.baku-d.bakuKmz)/Math.max(t.baku,1)>.15?`<p class="note">Luas baku Excel ${n1(t.baku,0)} ha dan poligon peta ${n1(d.bakuKmz,0)} ha berbeda jauh. Yang dipakai adalah nilai terbesar, kecuali sudah diubah.</p>`:'');
    edbind(d);
  }
}
/*P*/
const nz=x=>{const v=parseFloat(x);return isFinite(v)?v:0},
norm=s=>String(s).toLowerCase().replace(/\b(di|sbr|sumber|ters|desa)\b\.?/g,' ').replace(/\(.*?\)/g,' ').replace(/\b(19|20)\d\d\b/g,' ').replace(/\b(ok|sip|fix|fixs|top)\b/g,' ').replace(/[^a-z0-9]/g,''),
bk=n=>norm(n)+(/\b(sbr|sumber)\b/i.test(n)?'~s':''),
rv=r=>{const v=Array.from({length:30},(_,i)=>nz(r[i])),sm=(a,b)=>v.slice(a,b).reduce((x,y)=>x+y,0);return{baku:v[2],padi:v[5]+v[8]+v[11]+v[14]+v[17],persiapan:[3,4,6,7,9,10,12,13,15,16].reduce((x,i)=>x+v[i],0),tebu:sm(18,21),palawija:sm(21,24),total:v[24],bero:v[25],panen:v[26]}},
blocks=rows=>{const T={};let b=null;for(const r of rows){const s=r[1]?String(r[1]).trim():'';if(/^DI/i.test(s)){b=bk(s.replace(/^DI\.?\s*/i,''));T[b]={own:nz(r[2])>0?rv(r):null,ch:[]}}else if(b&&s&&nz(r[2])>0&&!/^(JURU|UPTD|JUMLAH|TOTAL)/i.test(s)){const v=rv(r);v.n=s.toLowerCase();v.o=s;T[b].ch.push(v)}}return T},
pick=(T,ks)=>{for(const k of ks){const t=T[k];if(!t)continue;if(t.own)return t.own;let ch=t.ch;if(!ch.length)continue;const te=ch.filter(c=>c.n.startsWith('ters'));if(te.length)ch=te;const o={};for(const f in ch[0])if(f!='n'&&f!='o')o[f]=ch.reduce((s,c)=>s+c[f],0);return o}return null},
tersOf=(T,ks)=>{for(const k of ks){const t=T[k];if(!t)continue;const r=t.ch.filter(c=>c.n.startsWith('ters')).slice(0,60).map(c=>({n:c.o,baku:+c.baku.toFixed(2),padi:+c.padi.toFixed(2),tebu:+c.tebu.toFixed(2),palawija:+c.palawija.toFixed(2),bero:+c.bero.toFixed(2),panen:+c.panen.toFixed(2)}));if(r.length)return r}return[]},
deb=rows=>{const D={},ex=['JURU PENGAIRAN','UPTD','PURWOSARI'];let cd=null,nm=null,ty,le,ko;rows.forEach((r,i)=>{const c=r[1]?String(r[1]):'';if(c&&c===c.toUpperCase()&&/[A-Z]/.test(c)&&!ex.includes(c))cd=norm(c);if(r[2]&&String(r[2]).trim()){nm=String(r[2]).trim();ty=r[4];le=r[5];ko=r[6]}
 if(r[8]=='Q->'&&cd&&nm&&i>0&&rows[i-1][8]=='H->'){const q=r.slice(9,19).filter(x=>typeof x=='number'),h=rows[i-1].slice(9,19).filter(x=>typeof x=='number'),a=x=>x.reduce((s,y)=>s+y,0)/x.length;if(q.length&&nm!='Limpasan')(D[cd]=D[cd]||{})[nm]={n:nm,q:+a(q).toFixed(1),h:h.length?+a(h).toFixed(1):0,tipe:ty,lebar:le,kond:ko}}});return D};
/*E*/
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const applyUp=()=>{if(!UP)return;DB.periode=UP.periode;DB.di.forEach(d=>{if(UP.t[d.nama])d.tanam=UP.t[d.nama];if(UP.q[d.nama])d.debit=UP.q[d.nama];if(UP.s&&UP.s[d.nama])d.ters=UP.s[d.nama]})};
function edform(d,bk){return '<form class="ed" id="ed"><label>Luas baku (ha)<input type="number" step="0.1" min="0" id="bk" value="'+(+bk).toFixed(1)+'"></label><button class="btn p">Simpan</button>'+(OV[d.nama]!=null?'<button type="button" class="btn" id="rs">Kembalikan</button>':'')+'</form><p class="note">Perubahan luas baku tersimpan di perangkat ini.</p>'}
function edbind(d){$('#ed').onsubmit=e=>{e.preventDefault();const v=parseFloat($('#bk').value);if(v>=0){OV[d.nama]=v;save('ov',OV);tab()}};const r=$('#rs');if(r)r.onclick=()=>{delete OV[d.nama];save('ov',OV);tab()}}
function xl(){
  const h=document.createElement('section');h.className='imp';
  h.innerHTML='<h2>Perbarui data tanaman</h2><p class="lead">Pilih file Excel laporan tanaman dan debit dengan format yang sama (sheet 5, 5a, dan 06). Hasilnya langsung tampil di perangkat ini.</p><input type="file" id="xf" accept=".xlsx,.xlsm" aria-label="File Excel"><p class="note" id="xs"></p><div class="act"><button class="btn p" id="dl">Unduh data.json untuk dibagikan</button>'+(UP?'<button class="btn" id="rx">Hapus pembaruan di perangkat ini</button>':'')+'</div><p class="note">Agar semua juru melihat data yang sama, unggah data.json hasil unduhan ke repo GitHub menggantikan yang lama.</p>';
  app.appendChild(h);
  $('#xs').textContent=MSG||(UP?'Pembaruan aktif di perangkat ini, periode '+UP.periode+'.':'Periode data saat ini: '+DB.periode+'.');
  $('#xf').onchange=imp;$('#dl').onclick=dl;const r=$('#rx');if(r)r.onclick=()=>{try{localStorage.removeItem('up')}catch(e){}location.reload()};
}

  if(on)h+='<div class="fm"><label>Folder (saluran atau area)<select id="fsel">'+fl.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('')+'<option value="__baru">Folder baru…</option></select></label><input type="text" id="fnew" placeholder="Nama folder baru" hidden aria-label="Nama folder baru">'+
  '<label>Tautkan ke bangunan (boleh kosong)<select id="fbg"><option value="">(tidak ditautkan)</option>'+d.bangunan.map(b=>`<option value="${esc(b[0])}">${esc(b[0])}</option>`).join('')+'</select></label>'+
  `<label>Nama pengunggah<input type="text" id="fol" value="${esc(oleh)}" placeholder="Nama Anda"></label><input type="file" id="ff" accept="image/*" multiple aria-label="Pilih foto" style="color:var(--mu)"><div class="act"><button class="btn p" id="fup">Unggah</button><button class="btn" id="fsy">Sinkron${q.length?' ('+q.length+' menunggu)':''}</button></div><p class="note" id="fst">${esc(msg||(R.online?'':'Daftar foto online tidak bisa dimuat, periksa sinyal lalu ketuk Sinkron.'))}</p></div>`;
  else h+='<p class="note">Menambah foto dan laporan dari HP butuh Supabase (lihat docs/FOTO.md). Foto yang sudah tersedia tetap tampil di bawah.</p>';
  if(!L.length)h+='<p class="note">Belum ada foto untuk DI ini.</p>';
  for(const f of fl){const a=L.map((x,i)=>[x,i]).filter(x=>x[0].folder==f);h+=`<h2>${esc(f)} (${a.length})</h2><div class="gal">`+a.map(([x,i])=>`<img loading="lazy" src="${ft(x)}" data-i="${i}" alt="${esc(x.nomor||'foto')}">`).join('')+'</div>'}
  el.innerHTML=h;el.querySelectorAll('.gal').forEach(gl=>gl.onclick=e=>{const i=e.target.dataset.i;if(i!=null)lb(L[i],d)});
  if(!on)return;
  const fs=$('#fsel');if(!fl.length)fs.value='__baru';const sw=()=>$('#fnew').hidden=fs.value!='__baru';fs.onchange=sw;sw();
  $('#fsy').onclick=async()=>{$('#fst').textContent='Menyinkronkan…';let ok=0;for(const it of q){try{await(it.tipe=='laporan'?kirimLap(it):kirim(it));await qop('readwrite',t=>t.delete(it.id));ok++}catch(e){break}}fto(el,ok?ok+' item dari antrean terkirim.':'Data foto diperbarui.')};
  $('#fup').onclick=async()=>{
    const fs2=[...$('#ff').files],s=$('#fst');if(!fs2.length){s.textContent='Pilih foto dulu.';return}
    const folder=(fs.value=='__baru'?$('#fnew').value:fs.value).trim()||'umum',bg=$('#fbg').value,ol=$('#fol').value.trim();try{localStorage.setItem('oleh',ol)}catch(e){}
    let ok=0,an=0;
    for(const [i,f] of fs2.entries()){s.textContent='Memproses '+(i+1)+' dari '+fs2.length+'…';
      const base=slug(d.nama)+'/'+slug(folder)+'/'+Date.now().toString(36)+i,it={id:Date.now()+i+Math.random(),nama:d.nama,folder,nomor:f.name.replace(/\.[^.]+$/,''),bangunan:bg,oleh:ol,diambil:new Date(f.lastModified).toISOString(),path:base+'.jpg',tpath:base+'_t.jpg'};
      try{it.full=await kecil(f,1280,.75);it.thumb=await kecil(f,360,.7)}catch(e){continue}
      try{await kirim(it);ok++}catch(e){try{await qop('readwrite',t=>t.put(it));an++}catch(e2){}}}
    fto(el,ok+' foto terunggah'+(an?', '+an+' menunggu sinyal (ketuk Sinkron nanti)':'')+'.')};
}
function lb(f,d){
  const bf=f.bangunan&&d.bangunan.find(b=>b[0]==f.bangunan),o=document.createElement('div');o.className='lb';
  o.innerHTML=`<div class="lbi"><img src="${fu(f)}" alt=""><div class="note">${esc(f.folder)} · ${esc(f.nomor||'')}${f.oleh?' · '+esc(f.oleh):''}${f.diambil?' · '+new Date(f.diambil).toLocaleDateString('id-ID'):''}${f.bangunan?'<br>Bangunan: '+esc(f.bangunan):''}</div>`+
  (f.statis?'':`<label class="lbl">Tautkan ke bangunan<select id="lbb"><option value="">(belum ditautkan)</option>${d.bangunan.map(b=>`<option value="${esc(b[0])}"${b[0]==f.bangunan?' selected':''}>${esc(b[0])}</option>`).join('')}</select></label>`)+
  '<div class="act">'+(f.statis?'':'<button class="btn p" id="lbs">Simpan tautan</button>')+(bf?'<button class="btn" id="lbm">Lihat di peta</button>':'')+'<button class="btn" id="lbx">Tutup</button></div><p class="note" id="lbt"></p></div>';
  document.body.appendChild(o);const x=()=>o.remove();
  o.onclick=e=>{if(e.target===o)x()};o.querySelector('#lbx').onclick=x;
  const m=o.querySelector('#lbm');if(m)m.onclick=()=>{x();document.querySelectorAll('.lb').forEach(z=>z.remove());map.flyTo([bf[1],bf[2]],18);scrollTo({top:0,behavior:'smooth'})};
  const sv=o.querySelector('#lbs');if(sv)sv.onclick=async()=>{const v=o.querySelector('#lbb').value,r=await sb('/rest/v1/foto?id=eq.'+f.id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({bangunan:v||null})});
    if(r.ok){f.bangunan=v||null;o.querySelector('#lbt').textContent='Tautan disimpan.'}else o.querySelector('#lbt').textContent='Gagal menyimpan ('+r.status+').'};
}

</script>
